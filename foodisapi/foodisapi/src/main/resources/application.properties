spring.application.name=foodisapi

# mongo db configuration

spring.data.mongodb.uri=${MONGO.ATLAS.CONNECTION.STRING}

# Multipart file properties 

spring.servlet.multipart.enabled=true

spring.servlet.multipart.max-file-size=10MB
spring.servlet.multipart.max-request-size=10MB

# Jwt Secret

jwt.secret.key=${JWT.SECRET}

# Razorpay Test API Key and Test key Secret

razorpay.test.api.key=${RAZORPAY.TEST.API.KEY}
razorpay.test.api.key.secret=${RAZORPAY.TEST.API.KEY.SECRET}

# cloudinary configuration

cloudinary.cloud.name=${CLOUDINARY.CLOUD.NAME}
cloudinary.api.key=${CLOUDINARY.API.KEY}
cloudinary.api.secret=${CLOUDINARY.API.SECRET}

   